<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses — Hayward Invitational</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="img/logo.jpg" alt="Hayward Invitational League Logo">
      <span class="brand-text">
        <span class="kicker">Est. 2024</span>
        <span class="title">Hayward Invitational</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="captains.html">Captains</a>
      <a href="courses.html" class="active">Courses</a>
      <a href="history.html">History</a>
      <a href="rankings.html">Power Rankings</a>
      <a href="rosters.html">Rosters</a>
      <a href="simulation.html">Simulation</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>Course Overview</h1>
    <p>Two Hayward, WI classics — one weekend.</p>
  </div>
</section>

<main>
  <div class="container" id="courses-root"></div>
</main>

<footer class="site-footer">
  <div class="container">
    <p>Hayward Invitational &middot; <span class="gold-text">Big Fish Golf Club</span> &amp; <span class="gold-text">Hayward Golf Course</span> &middot; Hayward, WI</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script>
function sum(arr) { return arr.reduce((a,b) => a + (b||0), 0); }

function scorecardTable(course, tees) {
  const holesOut = [0,1,2,3,4,5,6,7,8];
  const holesIn = [9,10,11,12,13,14,15,16,17];
  const par = course.par;

  function row(label, values, isTotal, skipTotals) {
    const out = values.slice(0,9);
    const inn = values.slice(9,18);
    return `<tr${isTotal ? ' style="font-weight:700;"' : ''}>
      <td>${label}</td>
      ${out.map(v => `<td class="num">${v ?? "—"}</td>`).join("")}
      <td class="num" style="background:rgba(15,81,50,0.06);">${skipTotals ? "" : sum(out)}</td>
      ${inn.map(v => `<td class="num">${v ?? "—"}</td>`).join("")}
      <td class="num" style="background:rgba(15,81,50,0.06);">${skipTotals ? "" : sum(inn)}</td>
      <td class="num" style="background:rgba(212,175,55,0.15); font-weight:700;">${skipTotals ? "" : sum(values)}</td>
    </tr>`;
  }

  const header = `<tr>
    <th>Hole</th>
    ${holesOut.map(h => `<th class="num">${h+1}</th>`).join("")}
    <th class="num">Out</th>
    ${holesIn.map(h => `<th class="num">${h+1}</th>`).join("")}
    <th class="num">In</th>
    <th class="num">Total</th>
  </tr>`;

  let rows = header + row("Par", par, true);
  tees.forEach(t => { rows += row(t.label, t.values); });
  if (course.hcp) rows += row("Handicap", course.hcp, false, true);

  return `<div class="table-wrap"><table>${rows}</table></div>`;
}

function mapSection(course) {
  if (!course.mapImage) return "";
  const caption = course.mapImage.attribution || "Official routing map, from the club's own scorecard.";
  return `
    <div class="section-title" style="margin-top:36px;"><h3 style="margin:0;">Course Map</h3></div>
    <div class="map-frame map-image"><img src="${course.mapImage.src}" alt="${course.mapImage.alt}"></div>
    <p class="muted" style="font-size:0.8rem; margin-top:8px;">${caption}</p>`;
}

function gallerySection(course) {
  if (!course.photos || !course.photos.length) return "";
  return `
    <div class="section-title" style="margin-top:36px;"><h3 style="margin:0;">Visual Highlights</h3></div>
    <div class="course-gallery">
      ${course.photos.map(p => `
        <figure>
          <img src="${p.src}" alt="${p.alt}" loading="lazy">
          <figcaption>${p.alt}</figcaption>
        </figure>`).join("")}
    </div>`;
}

function courseSection(course, tees, ratings, extraNote) {
  return `
  <div class="section">
    <div class="section-title"><h2>${course.name}</h2></div>
    <div class="card" style="margin-bottom:20px;">
      <p>${course.blurb}</p>
      <div class="grid-2" style="margin-top:16px;">
        <div>
          <div class="muted" style="font-size:0.78rem; text-transform:uppercase; letter-spacing:.06em;">Location</div>
          <div>${course.location}</div>
          ${course.designer ? `<div class="muted" style="font-size:0.78rem; text-transform:uppercase; letter-spacing:.06em; margin-top:10px;">Designer</div><div>${course.designer}</div>` : ""}
        </div>
        <div>
          <div class="muted" style="font-size:0.78rem; text-transform:uppercase; letter-spacing:.06em;">Rating / Slope</div>
          <div>${ratings}</div>
          <div class="muted" style="font-size:0.78rem; text-transform:uppercase; letter-spacing:.06em; margin-top:10px;">Amenities</div>
          <div>${course.amenities.join(" · ")}</div>
        </div>
      </div>
    </div>
    ${scorecardTable(course, tees)}
    <p class="muted" style="font-size:0.82rem; margin-top:10px;">${extraNote}</p>
    ${mapSection(course)}
    ${gallerySection(course)}
  </div>`;
}

const bf = HI_DATA.courses.bigFish;
const hw = HI_DATA.courses.hayward;

document.getElementById("courses-root").innerHTML =
  courseSection(bf,
    [{label:"Green Tees", values: bf.yardageGreen}, {label:"White Tees", values: bf.yardageWhite}],
    `Green ${bf.ratingGreen} &middot; White ${bf.ratingWhite}`,
    `Source: ${bf.source}`) +
  courseSection(hw,
    [{label:"Black Tees", values: hw.yardageBlack}, {label:"Blue Tees", values: hw.yardageBlue}, {label:"White Tees", values: hw.yardageWhite}],
    `Black ${hw.ratingBlack} &middot; Blue ${hw.ratingBlue} &middot; White ${hw.ratingWhite}`,
    `Source: ${hw.source}`);
</script>

</body>
</html>
